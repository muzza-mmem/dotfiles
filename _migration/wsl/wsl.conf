# → /etc/wsl.conf  (installed by _migration/install/90-wsl.sh)
#
# Takes effect after `wsl --shutdown` from Windows.

[boot]
systemd = true

[user]
# MUST name an account that exists on the distro. If it doesn't, the distro
# stops opening sessions after `wsl --shutdown` (recovery: `wsl -u root`), so
# 90-wsl.sh refuses to install this file unless `id -u <name>` resolves.
# Change this line if the fresh distro's first user is named anything else.
default = muzzakhan

[automount]
# metadata is what makes chmod/chown actually stick under /mnt/c.
options = "metadata,umask=22,fmask=11"

[interop]
# Windows PATH stays appended — `explorer.exe .`, `cmd.exe`, and wslpath-based
# tooling all depend on it. It does cost some shell-startup time.
appendWindowsPath = true
