# ── General ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10

# ── Window titles: show dir/command, not hostname ───────────────────
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'
set -g set-titles on
set -g set-titles-string '#S:#I #W'
set -g focus-events on
setw -g mode-keys vi

# ── Pane borders: highlight the active pane ─────────────────────────
set -g pane-border-style "fg=#45475a"        # inactive: Catppuccin surface1 (dim grey)
set -g pane-active-border-style "fg=#cba6f7" # active: Catppuccin mauve (accent)

# ── Pane title bar: label each pane on its top border ───────────────
# Claude Code sets a "<branch>  <glyph> <task>" pane title via a hook
# (~/.claude/hooks/tmux-pane-title.sh); plain shell panes fall back to
# "dir · command". Lets you tell split Claude instances apart at a glance.
set -g pane-border-status top
set -g pane-border-format '#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#[fg=#6c7086] #{b:pane_current_path} · #{pane_current_command} ,#[fg=#cba6f7] #{pane_title} }'

# ── Prefix ──────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-b
bind C-b send-prefix

# ── Reload config ───────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Splits keep cwd ─────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Equalize panes (equal widths, keeps side-by-side layout) ────────
bind = select-layout even-horizontal

# ── Pane navigation (prefix + arrows) ───────────────────────────────
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# ── Move / swap / flip panes ────────────────────────────────────────
bind V move-pane -h -s '!'   # flip the two panes side by side (vertical split)
bind H move-pane -v -s '!'   # flip the two panes stacked (horizontal split)
bind '{' swap-pane -U        # swap current pane with the previous one
bind '}' swap-pane -D        # swap current pane with the next one
bind o rotate-window         # rotate all panes through their slots

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# ── Window cycling (Shift+Left/Right) ───────────────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window

# ── Move window left/right (Ctrl+Shift+Left/Right) ──────────────────
bind -n C-S-Left  swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# ── Toggle to last-used session (MRU, like alt-tab) ─────────────────
bind '`' switch-client -l

# ── Plugins (TPM) ───────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'

set -g @continuum-restore 'on'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_status_style "basic"
set -g allow-rename off

# Auto-install TPM if missing, then init
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
